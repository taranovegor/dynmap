name: CI

on:
  push:
    branches: [ v3.0-community ]
  pull_request:

permissions:
  contents: read

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: DynmapCoreAPI + DynmapCore build & test
        run: ./gradlew :DynmapCoreAPI:build :DynmapCore:test --console=plain
