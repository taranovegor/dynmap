name: Build platform jars

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: spigot
            task: ':spigot:shadowJar'
            java: '25'
          - module: fabric-1.14.4
            task: ':fabric-1.14.4:build'
            java: '21'
          - module: fabric-1.15.2
            task: ':fabric-1.15.2:build'
            java: '21'
          - module: fabric-1.16.4
            task: ':fabric-1.16.4:build'
            java: '21'
          - module: fabric-1.17.1
            task: ':fabric-1.17.1:build'
            java: '21'
          - module: fabric-1.18.2
            task: ':fabric-1.18.2:build'
            java: '21'
          - module: fabric-1.19.4
            task: ':fabric-1.19.4:build'
            java: '21'
          - module: fabric-1.20.6
            task: ':fabric-1.20.6:build'
            java: '21'
          - module: fabric-1.21.6
            task: ':fabric-1.21.6:build'
            java: '21'
          - module: fabric-1.21.9-10
            task: ':fabric-1.21.9-10:build'
            java: '21'
          - module: fabric-1.21.11
            task: ':fabric-1.21.11:build'
            java: '21'
          - module: fabric-26.1
            task: ':fabric-26.1:build'
            java: '25'
          - module: forge-26.1
            task: ':forge-26.1:build'
            java: '21'

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Build ${{ matrix.module }}
        run: ./gradlew ${{ matrix.task }} --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: dynmap-${{ matrix.module }}
          path: target/*.jar
          if-no-files-found: error
